[env:Convertor_UART_CRSF115Inv_To_CRSF115Inv_ESP32C3]
extends = env_common_esp32c3
build_src_filter = +<convertor.cpp>
build_flags =
    ${env_common_esp32c3.build_flags}
    -D IN_BAUD=115200
    -D OUT_BAUD=115200
    -D IN_INV=true
    -D OUT_INV=true
    -D PIN_IN_RX=20
    -D PIN_OUT_TX=10
    -D PIN_BUTTON=6
